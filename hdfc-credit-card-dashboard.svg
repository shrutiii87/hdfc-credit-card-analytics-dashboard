<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#004B8D"/>
    <stop offset="1" stop-color="#ED232A"/>
  </linearGradient>

  <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0057A8"/>
    <stop offset="1" stop-color="#22A6F2"/>
  </linearGradient>

  <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6D4AFF"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".12"/>
  </filter>

  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity=".10"/>
  </filter>

  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#CBD5E1"/>
  </pattern>
</defs>

<!-- WHITE BACKGROUND -->
<rect width="1200" height="420" rx="28" fill="#FFFFFF"/>

<!-- SUBTLE DECORATIVE AREAS -->
<path d="M0 0H410V420H0Z" fill="#F8FAFC"/>
<path d="M930 0H1200V420H930Z" fill="#F8FAFC"/>

<rect x="1010" y="35" width="135" height="135"
