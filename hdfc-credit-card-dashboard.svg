<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0a0e24"/><stop offset="1" stop-color="#141a3a"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="0" x2="1">
    <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22f5d0"/>
  </linearGradient>
  <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1e274f" stroke-width="0.8" opacity="0.5"/>
  </pattern>
</defs>

<rect width="1200" height="350" rx="20" fill="url(#bg)"/>
<rect width="1200" height="350" rx="20" fill="url(#grid)"/>
<rect width="1200" height="350" rx="20" fill="none" stroke="#1e2f5f" stroke-width="1.2"/>

<!-- LEFT CARD - SECURE DATA -->
<g transform="translate(28 28)">
  <rect width="180" height="294" rx="22" fill="#101636" fill-opacity="0.7" stroke="#1e3a6a" stroke-width="1"/>
  <!-- outer dashed circle -->
  <g transform="translate(90 140)">
    <circle r="68" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
    <circle r="52" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 8" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- glow behind -->
    <circle r="58" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
    <!-- shield / card icon -->
    <g transform="translate(-32 -42)">
      <path d="M32 2 L60 14 L60 38 Q60 58 32 72 Q4 58 4 38 L4 14 Z" fill="url(#shieldGrad)" stroke="#a5b4fc" stroke-width="1.5" filter="url(#glow)"/>
      <path d="M32 8 L54 18 L54 38 Q54 54 32 66 Q10 54 10 38 L10 18 Z" fill="#1e1b4b" opacity="0.9"/>
      <!-- credit card icon inside -->
      <rect x="18" y="28" width="28" height="18" rx="3" fill="#fde68a" stroke="white" opacity="0.9"/>
      <rect x="20" y="33" width="24" height="2" fill="#b45309" opacity="0.5"/>
      <path d="M20 38 L28 32 L36 42" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g transform="translate(90 265)">
    <circle r="5" fill="#22d3ee" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/></circle>
    <text y="22" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="2.5" fill="#6b8cae" font-weight="600">SECURE DATA</text>
  </g>
</g>

<!-- CENTER -->
<g transform="translate(260 28)">
  <!-- DATA INTELLIGENCE PILL -->
  <g>
    <rect width="180" height="26" rx="13" fill="#162040" stroke="#1e3a6a"/>
    <circle cx="14" cy="13" r="4" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="26" y="17" font-family="Arial" font-size="11" letter-spacing="2" fill="#8bb4e0" font-weight="700">DATA INTELLIGENCE</text>
  </g>

  <text x="0" y="75" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#f1f5f9">HDFC Bank Credit Card</text>
  <rect x="0" y="90" width="520" height="3" rx="1.5" fill="url(#lineGrad)"/>
  <text x="0" y="130" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#cbd5e1" letter-spacing="0.3">Power BI Analytics Dashboard 💳📊</text>

  <!-- bottom timeline -->
  <g transform="translate(0 178)">
    <line x1="0" y1="6" x2="360" y2="6" stroke="#2a3a6a" stroke-width="1"/>
    <g>
      <circle cx="0" cy="6" r="5" fill="#22d3ee" filter="url(#glow)"/>
      <text x="0" y="-14" font-family="Arial" font-size="10" letter-spacing="2" fill="#64748b">EXTRACT</text>
    </g>
    <g transform="translate(140 0)">
      <circle cx="0" cy="6" r="5" fill="#a78bfa" filter="url(#glow)"/>
      <text x="-8" y="-14" font-family="Arial" font-size="10" letter-spacing="2" fill="#94a3b8">MODEL</text>
      <circle cx="0" cy="6" r="3" fill="white"/>
    </g>
    <g transform="translate(280 0)">
      <circle cx="0" cy="6" r="5" fill="#2dd4bf" filter="url(#glow)"/>
      <text x="-12" y="-14" font-family="Arial" font-size="10" letter-spacing="2" fill="#64748b">VISUALIZE</text>
    </g>
    <circle r="3" fill="white" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M0 6 H360"/></circle>
  </g>
</g>

<!-- RIGHT CARD - RISK ANALYTICS -->
<g transform="translate(940 28)">
  <rect width="232" height="294" rx="22" fill="#101636" fill-opacity="0.7" stroke="#1e3a6a" stroke-width="1"/>
  <text x="20" y="32" font-family="Arial" font-size="11" letter-spacing="2.5" fill="#6b8cae" font-weight="600">CREDIT ANALYTICS</text>
  
  <!-- circular progress -->
  <g transform="translate(70 118)">
    <circle r="46" fill="none" stroke="#1e274f" stroke-width="8"/>
    <circle r="46" fill="none" stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="210 80" stroke-dashoffset="40" transform="rotate(-90)">
      <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="white">9.2K</text>
    <text y="22" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="1.5" fill="#6b8cae">CUSTOMERS</text>
  </g>

  <!-- bars -->
  <g transform="translate(140 78)" font-family="Arial" font-size="9">
    <text x="0" y="0" fill="#8bb4e0" letter-spacing="1">SPEND</text>
    <rect y="8" width="70" height="6" rx="3" fill="#1e274f"/><rect y="8" width="52" height="6" rx="3" fill="#22d3ee"/>
    
    <text x="0" y="34" fill="#a5b4fc" letter-spacing="1">REVENUE</text>
    <rect y="42" width="70" height="6" rx="3" fill="#1e274f"/><rect y="42" width="62" height="6" rx="3" fill="#a78bfa"/>
    
    <text x="0" y="68" fill="#6ee7b7" letter-spacing="1">TXNS</text>
    <rect y="76" width="70" height="6" rx="3" fill="#1e274f"/><rect y="76" width="45" height="6" rx="3" fill="#2dd4bf"/>
  </g>

  <circle cx="20" cy="260" r="2" fill="#22d3ee" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="205" cy="200" r="2" fill="#a78bfa" opacity="0.8"/>
</g>

<!-- subtle vignette -->
<circle cx="600" cy="175" r="400" fill="#22d3ee" opacity="0.03" filter="url(#glow)"/>
</svg>
