           dur="4s"
           repeatCount="indefinite"/>
  <animate attributeName="opacity"
           values=".8;.25;.8"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<!-- TOP ACCENT -->
<rect x="52" y="38" width="72" height="5" rx="3" fill="#ED232A"/>
<rect x="124" y="38" width="72" height="5" rx="3" fill="#004B8D"/>

