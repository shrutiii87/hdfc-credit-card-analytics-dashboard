<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"> 
    <stop stop-color="#020b1a"/><stop offset=".55" stop-color="#0a1e3c"/><stop offset="1" stop-color="#081325"/>
  </linearGradient>
  <linearGradient id="hdfc" x1="0" x2="1">
    <stop stop-color="#004B8D"/><stop offset="1" stop-color="#ED232A"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" x2="1">
    <stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0e2a5a"/><stop offset="1" stop-color="#1e40af"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bgBlur"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)" opacity=".22"/>

<!-- ambient glow -->
<circle cx="1020" cy="80" r="110" fill="#3b82f6" opacity=".09" filter="url(#bgBlur)">
  <animate attributeName="cx" values="1020;960;1020" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="150" cy="350" r="85" fill="#22d3ee" opacity=".07" filter="url(#bgBlur)"/>

<!-- circuit lines -->
<g fill="none" stroke="#123159" stroke-width="1">
  <path d="M0 68H260V32H350"/><path d="M0 95H210"/><path d="M940 350H1200"/><path d="M1020 0V42H1160V110"/>
</g>
<g fill="#38bdf8"><circle cx="260" cy="68" r="3"/><circle cx="350" cy="32" r="3"/><circle cx="1020" cy="42" r="3"/><circle cx="1160" cy="110" r="3"/></g>

<!-- LEFT TITLE -->
<text x="62" y="78" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#60a5fa" font-weight="700">HDFC BANK</text>
<text x="62" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Credit Card</text>
<text x="62" y="151" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="url(#cyan)">Analytics Dashboard</text>
<text x="64" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#94a3b8">Power BI Project 💳📊</text>
<text x="64" y="205" font-family="Arial,sans-serif" font-size="13" fill="#64748b">End-to-end spend, revenue & customer insights</text>

<!-- PIPELINE -->
<g transform="translate(62 242)">
  <g>
    <rect width="118" height="54" rx="14" fill="#0a1931" stroke="#1e40af"/>
    <circle cx="24" cy="27" r="12" fill="#1e3a8a"/><text x="24" y="31" text-anchor="middle" font-family="Arial" font-size="10" fill="white">SQL</text>
    <text x="48" y="31" font-family="Arial" font-size="11" font-weight="700" fill="white">RAW DATA</text>
  </g>
  <path d="M118 27H150" stroke="#3b82f6" stroke-width="2.5"/>
  <circle r="4" fill="#60a5fa" filter="url(#glow)"><animateMotion dur="1.3s" repeatCount="indefinite" path="M118 27H150"/></circle>

  <g transform="translate(150)">
    <rect width="118" height="54" rx="14" fill="#0a1931" stroke="#22d3ee"/>
    <circle cx="24" cy="27" r="12" fill="#0e7490"/><text x="24" y="31" text-anchor="middle" font-family="Arial" font-size="10" fill="white">DAX</text>
    <text x="48" y="31" font-family="Arial" font-size="11" font-weight="700" fill="white">MODELING</text>
  </g>
  <path d="M268 27H300" stroke="#22d3ee" stroke-width="2.5"/>
  <circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M268 27H300"/></circle>

  <g transform="translate(300)">
    <rect width="145" height="54" rx="14" fill="#0a1931" stroke="#a78bfa"/>
    <circle cx="24" cy="27" r="12" fill="#5b21b6"/><text x="24" y="31" text-anchor="middle" font-family="Arial" font-size="9" fill="white">PBI</text>
    <text x="48" y="31" font-family="Arial" font-size="11" font-weight="700" fill="white">DASHBOARD</text>
  </g>
  <path d="M445 27H475" stroke="#a78bfa" stroke-width="2.5"/>
  <circle r="4" fill="#c4b5fd" filter="url(#glow)"><animateMotion dur="1.4s" repeatCount="indefinite" path="M445 27H475"/></circle>

  <g transform="translate(475)">
    <rect width="105" height="54" rx="14" fill="#0a1931" stroke="#34d399"/>
    <circle cx="24" cy="27" r="12" fill="#065f46"/><path d="M18 27l5 5 9-10" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <text x="48" y="31" font-family="Arial" font-size="11" font-weight="700" fill="white">INSIGHTS</text>
  </g>
</g>

<!-- RIGHT CARD VISUAL -->
<g transform="translate(805 45)">
  <rect width="335" height="210" rx="22" fill="#08162e" stroke="#1e3a5f"/>
  <text x="22" y="28" font-family="monospace" font-size="10" letter-spacing="2" fill="#64748b">HDFC CREDIT CARD • LIVE</text>
  
  <!-- credit card -->
  <g transform="translate(22 38)">
    <rect width="185" height="112" rx="16" fill="url(#cardGrad)" stroke="#3b82f6"/>
    <rect x="14" y="20" width="32" height="24" rx="4" fill="#fde68a" stroke="#fbbf24"/>
    <line x1="14" y1="32" x2="46" y2="32" stroke="#b45309" opacity=".5"/><line x1="30" y1="20" x2="30" y2="44" stroke="#b45309" opacity=".5"/>
    <text x="14" y="72" font-family="monospace" font-size="11" fill="#bfdbfe">••••  ••••  ••••  4589</text>
    <text x="14" y="90" font-family="Arial" font-size="8" fill="#93c5fd">HDFC BANK • VISA</text>
    <text x="125" y="90" font-family="Arial" font-size="8" font-weight="800" fill="white">POWER BI</text>
    <!-- shine scan -->
    <rect x="-20" y="0" width="30" height="112" fill="white" opacity=".08" transform="skewX(-20)">
      <animate attributeName="x" values="-20;180;-20" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- mini bar chart -->
  <g transform="translate(225 38)">
    <rect width="88" height="112" rx="14" fill="#0a1a32" stroke="#1e3a5f"/>
    <text x="11" y="18" font-family="monospace" font-size="7" fill="#64748b">SPEND TREND</text>
    <g transform="translate(12 26)">
      <rect x="0" y="36" width="10" height="28" rx="3" fill="#1e3a8a"/><rect x="0" y="56" width="10" height="8" rx="3" fill="#3b82f6" opacity=".6">
        <animate attributeName="height" values="8;28;8" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="20" width="10" height="44" rx="3" fill="#0e7490"/><rect x="16" y="40" width="10" height="24" rx="3" fill="#22d3ee" opacity=".7">
        <animate attributeName="height" values="24;44;24" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="32" y="10" width="10" height="54" rx="3" fill="#5b21b6"/><rect x="32" y="30" width="10" height="34" rx="3" fill="#a78bfa" opacity=".7">
        <animate attributeName="height" values="34;54;34" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="0" width="10" height="64" rx="3" fill="url(#hdfc)"/>
    </g>
  </g>

  <!-- kpi line -->
  <g transform="translate(22 165)">
    <rect width="291" height="1" fill="#1e3a5f"/>
    <g font-family="monospace" font-size="8">
      <text x="0" y="14" fill="#64748b">REVENUE</text><text x="0" y="26" fill="#f8fafc" font-size="11" font-weight="700">₹4.2M</text>
      <text x="80" y="14" fill="#64748b">TXNS</text><text x="80" y="26" fill="#f8fafc" font-size="11" font-weight="700">18.4K</text>
      <text x="155" y="14" fill="#64748b">CUSTOMERS</text><text x="155" y="26" fill="#22d3ee" font-size="11" font-weight="700">9.2K</text>
      <text x="235" y="14" fill="#64748b">UTIL %</text><text x="235" y="26" fill="#a78bfa" font-size="11" font-weight="700">32%</text>
    </g>
  </g>
</g>

<!-- floating chips -->
<g font-family="Arial" font-size="10" font-weight="700">
  <g transform="translate(815 272)">
    <rect width="78" height="28" rx="14" fill="#0a1931" stroke="#3b82f6"/><text x="39" y="18" text-anchor="middle" fill="#93c5fd">SPEND</text>
    <animateTransform attributeName="transform" type="translate" values="815 272;815 265;815 272" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(905 272)">
    <rect width="80" height="28" rx="14" fill="#052e2b" stroke="#2dd4bf"/><text x="40" y="18" text-anchor="middle" fill="#6ee7b7">REVENUE</text>
    <animateTransform attributeName="transform" type="translate" values="905 272;905 279;905 272" dur="2.6s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(997 272)">
    <rect width="95" height="28" rx="14" fill="#1e1b4b" stroke="#a78bfa"/><text x="47" y="18" text-anchor="middle" fill="#c4b5fd">CUSTOMERS</text>
    <animateTransform attributeName="transform" type="translate" values="997 272;997 265;997 272" dur="2.8s" repeatCount="indefinite"/>
  </g>
</g>

<!-- bottom road -->
<path d="M0 365H1200" stroke="#020b1a" stroke-width="42"/>
<path d="M0 365H1200" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="44 32">
  <animate attributeName="stroke-dashoffset" values="0;-76" dur="1s" repeatCount="indefinite"/>
</path>

<!-- moving card chip -->
<g>
  <g transform="translate(-150 336)">
    <rect width="96" height="26" rx="7" fill="#e0e7ff" stroke="#60a5fa"/>
    <rect x="8" y="7" width="16" height="12" rx="2" fill="#fbbf24"/>
    <rect x="30" y="9" width="40" height="3" rx="1.5" fill="#1e3a8a" opacity=".6"/>
    <rect x="30" y="14" width="25" height="3" rx="1.5" fill="#1e3a8a" opacity=".4"/>
    <animateTransform attributeName="transform" type="translate" values="-150 336;1250 336" dur="7s" repeatCount="indefinite"/>
  </g>
</g>

<!-- particles -->
<g fill="#60a5fa" filter="url(#glow)">
  <circle cx="720" cy="85" r="2.5"><animate attributeName="cy" values="85;68;85" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="315" r="2.5"><animate attributeName="cy" values="315;295;315" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
</svg>
